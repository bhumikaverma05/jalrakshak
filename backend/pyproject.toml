[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jalrakshak-api"
version = "0.1.0"
description = "FastAPI service for the JalRakshak water body monitoring system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi[standard]>=0.163,<0.164",
  "GeoAlchemy2>=0.18,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pwdlib[argon2]>=0.2,<1",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires the dedicated PostgreSQL/PostGIS test database"]

[tool.ruff]
line-length = 100
target-version = "py312"
